{% extends "base.html" %}

{% block content %}
<div class="profile-container">
    <h2>User Profile</h2>
    <div class="profile-info">
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Role:</strong> {{ user.role }}</p>
        <p><strong>Joined:</strong> {{ user.created_at.strftime('%Y-%m-%d') }}</p>
    </div>
</div>
{% endblock %}
