# gitleaks config: default rules + project allowlist.
# CI scans every commit of every branch (`gitleaks git --log-opts=--all`) on every push/PR; a new
# finding fails the build. A reviewed false positive in history goes to .gitleaksignore, with a reason.
[extend]
useDefault = true

[allowlist]
description = "Deliberately fake secrets used only by the test suite / docs"
paths = [
  '''^tests/support/factory\.py$''',
]
