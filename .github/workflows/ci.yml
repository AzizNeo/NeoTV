name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neotv
          POSTGRES_PASSWORD: neotv
          POSTGRES_DB: neotv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neotv" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neotv:neotv@localhost:5432/neotv_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.lock
      - name: Locks are current (requirements*.txt → requirements*.lock)
        run: pip install uv && python -m tools.lock_deps --check
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Module boundaries
        run: lint-imports
      - name: Tests (SQLite + fakeredis, then PostgreSQL + Redis integration)
        shell: bash
        run: set -o pipefail; pytest --cov --cov-report=term-missing -rfE --tb=short 2>&1 | tee test-output.log || { python tools/ci_report.py test-output.log; exit 1; }
      - name: OpenAPI contract is committed and current
        run: |
          python -m flask --app tools.openapi_app kernel openapi --out /tmp/openapi.json
          diff -u openapi/openapi.json /tmp/openapi.json

  secrets-scan:
    # Fails the build if a secret lands in the tree (config: .gitleaks.toml).
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  # A newcomer's first run, on the OS/Python the team actually uses. Catches what
  # unit tests cannot: missing wheels/deps, .env encoding, Windows code pages.
  setup-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install exactly like Kurulum.bat (hash-locked, wheels only)
        run: python -m pip install --require-hashes "--only-binary=:all:" -r requirements-dev.lock
      - name: Test suite
        shell: bash
        run: set -o pipefail; python -m pytest -q -rfE --tb=short 2>&1 | tee test-output.log || { python tools/ci_report.py test-output.log; exit 1; }
      - name: Fresh setup → API ready → admin login
        shell: bash
        run: set -o pipefail; python -m tools.smoke_boot 2>&1 | tee smoke-output.log || { python tools/ci_report.py smoke-output.log; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:api
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, setup-smoke, frontend, secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neotv/backend:ci .
      - run: docker build -f deploy/nginx/Dockerfile -t neotv/web:ci .
