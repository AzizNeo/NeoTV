name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neotv
          POSTGRES_PASSWORD: neotv
          POSTGRES_DB: neotv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neotv" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://neotv:neotv@localhost:5432/neotv_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.lock
      - name: Locks are current (requirements*.txt → requirements*.lock)
        run: pip install uv && python -m tools.lock_deps --check
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Module boundaries
        run: lint-imports
      - name: Tests (SQLite + fakeredis, then PostgreSQL + Redis integration)
        shell: bash
        run: set -o pipefail; pytest --cov --cov-report=json --cov-report=html -rfE --tb=short 2>&1 | tee test-output.log || { python tools/ci_report.py test-output.log; exit 1; }
      - name: Coverage per module (floors in pyproject.toml, table on the run's summary page)
        run: python -m tools.coverage_report coverage.json --summary "$GITHUB_STEP_SUMMARY" --badge badges/backend-coverage.json
      - name: Coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            htmlcov/
            badges/
          if-no-files-found: ignore
          retention-days: 14
      - name: OpenAPI contract is committed and current
        run: |
          python -m flask --app tools.openapi_app kernel openapi --out /tmp/openapi.json
          diff -u openapi/openapi.json /tmp/openapi.json

  secrets-scan:
    # Fails the build if a secret lands in the tree (config: .gitleaks.toml).
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan working tree
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  # A newcomer's first run, on the OS/Python the team actually uses. Catches what
  # unit tests cannot: missing wheels/deps, .env encoding, Windows code pages.
  setup-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.14" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install exactly like Kurulum.bat (hash-locked, wheels only)
        run: python -m pip install --require-hashes "--only-binary=:all:" -r requirements-dev.lock
      - name: Test suite
        shell: bash
        run: set -o pipefail; python -m pytest -q -rfE --tb=short 2>&1 | tee test-output.log || { python tools/ci_report.py test-output.log; exit 1; }
      - name: Fresh setup → API ready → admin login
        shell: bash
        run: set -o pipefail; python -m tools.smoke_boot 2>&1 | tee smoke-output.log || { python tools/ci_report.py smoke-output.log; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:api
      - name: Tests with coverage (floors in vite.config.js)
        run: npm run coverage
      - name: Coverage per area (table on the run's summary page)
        run: node scripts/coverage-summary.mjs --summary "$GITHUB_STEP_SUMMARY" --badge badges/frontend-coverage.json
      - name: Coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/badges/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, setup-smoke, frontend, secrets-scan]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neotv/backend:ci .
      - run: docker build -f deploy/nginx/Dockerfile -t neotv/web:ci .
      - name: nginx config is valid (security-headers snippet included)
        run: docker run --rm --add-host api:127.0.0.1 neotv/web:ci nginx -t

  # Alerting as code: the generated rules are current, valid, and behave as specified
  # (promtool unit tests: which alerts fire on which synthetic series — and which stay quiet).
  observability-rules:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.5.0"
      PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
    steps:
      - uses: actions/checkout@v4
      - name: promtool (pinned, checksum-verified)
        run: |
          curl -sSfL -o prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tgz" | sha256sum -c -
          tar xzf prometheus.tgz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Generated rules are current
        run: python3 deploy/prometheus/generate_rules.py --check
      - name: Rules are valid
        run: ./promtool check rules deploy/prometheus/neotv.rules.yml
      - name: Rules behave as specified
        run: ./promtool test rules deploy/prometheus/neotv.rules.test.yml
      - name: Prometheus configuration is valid (scrape job, rule files, Alertmanager)
        run: |
          mkdir -p /tmp/secrets && echo "ci-placeholder" > /tmp/secrets/metrics_token
          sed 's#/etc/prometheus/secrets/#/tmp/secrets/#' deploy/prometheus/prometheus.yml > deploy/prometheus/prometheus.ci.yml
          ./promtool check config deploy/prometheus/prometheus.ci.yml

  # Browser tests: the production build under the production CSP against a fresh, seeded backend.
  # Every test also fails on a CSP violation or an uncaught page error (frontend/e2e/fixtures.js).
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.lock  # fakeredis: the e2e backend runs without a Redis server
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Browser tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log" || {
            # Failures before the first test (a server that did not start) have no test annotation.
            echo "::error title=e2e output::$(grep -vE '^\s+at |dbus|^\s*$' "$RUNNER_TEMP/e2e.log" | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - name: Report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The one-command demo, end to end: build, start, sign in with the generated admin, check content.
  demo:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo (as a user would)
        run: |
          docker compose version
          set -o pipefail
          docker compose -f compose.demo.yml up --build --wait --wait-timeout 900 2>&1 | tee "$RUNNER_TEMP/up.log"
      - name: Sign-in box is printed
        run: docker compose -f compose.demo.yml logs --no-log-prefix setup | grep -q "NeoTV demo is ready"
      - name: Smoke test through nginx
        run: |
          export DEMO_PASSWORD="$(docker compose -f compose.demo.yml exec -T api python -c "from tools.demo_env import read; print(read()['NEOTV_ADMIN_PASSWORD'])")"
          echo "::add-mask::$DEMO_PASSWORD"
          python3 tools/demo_smoke.py http://localhost:8080
      - name: Restart keeps data and secrets (idempotent setup)
        run: |
          docker compose -f compose.demo.yml down
          docker compose -f compose.demo.yml up --wait --wait-timeout 300
          docker compose -f compose.demo.yml logs --no-log-prefix setup | grep -q "already exists - skipped"
          export DEMO_PASSWORD="$(docker compose -f compose.demo.yml exec -T api python -c "from tools.demo_env import read; print(read()['NEOTV_ADMIN_PASSWORD'])")"
          echo "::add-mask::$DEMO_PASSWORD"
          python3 tools/demo_smoke.py http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f compose.demo.yml ps -a
          docker compose -f compose.demo.yml logs --tail 200
          # Last lines as annotations (visible without downloading logs); passwords never printed.
          note() { sed '/Password/d' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=compose up::$(grep -v '^#' "$RUNNER_TEMP/up.log" 2>/dev/null | grep -vE 'Built|Pull|Download|Extract|Waiting|Verifying|exporting|naming|writing' | tail -30 | note)"
          echo "::error title=compose ps::$(docker compose -f compose.demo.yml ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' | note)"
          for svc in $(docker compose -f compose.demo.yml ps -a --format '{{.Service}}|{{.State}}|{{.Health}}|{{.ExitCode}}' \
                       | awk -F'|' '($2 != "running" && $4 != "0") || $3 == "unhealthy" || $3 == "starting" {print $1}'); do
            echo "::error title=demo service $svc::$(docker compose -f compose.demo.yml logs --no-log-prefix --tail 25 "$svc" 2>&1 | note)"
          done

  # Publishes the coverage badges (shields.io endpoint JSON) to the `badges` branch on every push
  # to main. The branch holds nothing else, so badge updates never touch the code history.
  badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-coverage"
          path: artifacts
      - name: Push to the badges branch
        run: |
          mkdir site && find artifacts -name '*-coverage.json' -path '*badges*' -exec cp {} site/ \;
          ls site
          cd site
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "coverage badges for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
