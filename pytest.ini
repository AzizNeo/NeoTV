# Overrides the legacy pytest.ini (which pointed at co-located legacy tests).
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    integration: needs real PostgreSQL + Redis (TEST_DATABASE_URL / TEST_REDIS_URL); skipped otherwise
    slow: long-running
filterwarnings =
    error::DeprecationWarning:app.*
