# Alembic configuration (used by Flask-Migrate: `flask db ...`).
#
# Revisions live in migrations/revisions/ — NOT migrations/versions/ (the legacy
# folder, which contained a broken revision; see tools/cleanup_legacy.py).
# New revision files are named  <yyyymmdd>_<rev>_<module>_<change>.py
#   e.g. `flask db migrate -m "billing add coupon"`.

[alembic]
version_locations = %(here)s/revisions
# os.pathsep splitting: project paths with spaces (e.g. Windows user folders) stay intact
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
revision_environment = true

[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
