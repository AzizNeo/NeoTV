# Security headers of the SPA — the single source of truth.
# Included in every nginx location that serves the app; `vite preview` (frontend/vite.config.js)
# reads the same lines, so the browser tests run under exactly this policy.
# One header per line, `add_header <Name> "<value>" always;` — the parsers rely on that shape.
#
# Content-Security-Policy, directive by directive:
#   script-src 'self'          only our bundle runs: no inline scripts, no eval, no CDNs (the XSS wall)
#   style-src 'self'           bundled CSS only (React sets inline styles through the CSSOM, which CSP allows)
#   img-src … https:           channel logos come from imported M3U lists (any HTTPS host); TMDB artwork
#   media-src / connect-src    'self' for proxied streams; https: because a channel may use *direct*
#     … https: blob:           delivery (the player fetches the CDN itself); blob: for MediaSource
#   worker-src 'self' blob:    hls.js parses segments in a worker created from a blob URL
#   object-src 'none', base-uri 'self', form-action 'self', frame-ancestors 'none'  the classic hardening set
# HTTP-only edges (the local demo) keep working: no upgrade-insecure-requests, HSTS only over HTTPS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $neotv_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
