# NeoTV edge (nginx). TLS terminates in front of this (load balancer / certbot).
upstream neotv_api {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Access log without credentials (ADR-0011): Xtream apps put a username and password in the path
# (/live/<user>/<password>/<id>.m3u8) or the query string, signed media URLs their grant in the
# query. The log keeps the path with credential segments masked and never the query string or
# the referrer. The API's own access log redacts the same way (shared_kernel.redaction).
map $uri $neotv_log_path {
    "~^(?<head>/(?:api/v1/xtream/)?(?:live|movie|series|timeshift)/)[^/]*/[^/]*(?<tail>/.*)$" "$head***/***$tail";
    default $uri;
}
map $args $neotv_log_query { "" ""; default "?..."; }
log_format neotv '$remote_addr - [$time_local] "$request_method $neotv_log_path$neotv_log_query $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent" $request_time $request_id';
# HSTS only when the TLS terminator in front says the request was HTTPS (an empty value = no header).
# No `preload`: joining the browsers' preload list is a separate, hard-to-undo operator decision.
map $http_x_forwarded_proto $neotv_hsts { https "max-age=31536000; includeSubDomains"; default ""; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log neotv;   # replaces the image's default (unredacted) format here
    client_max_body_size 26m;          # playlist import (25 MB cap in the API)

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://neotv_api;
        include /etc/nginx/snippets/neotv-api-proxy.conf;
    }

    # ── Xtream-compatible player API (ADR-0011) ────────────────────────────
    # Apps call these at the server root; the API serves them under /api/v1/xtream/.
    location = /player_api.php { rewrite ^ /api/v1/xtream/player_api.php break; proxy_pass http://neotv_api; include /etc/nginx/snippets/neotv-api-proxy.conf; }
    location = /xmltv.php      { rewrite ^ /api/v1/xtream/xmltv.php break;      proxy_pass http://neotv_api; include /etc/nginx/snippets/neotv-api-proxy.conf; }
    location = /get.php        { rewrite ^ /api/v1/xtream/get.php break;        proxy_pass http://neotv_api; include /etc/nginx/snippets/neotv-api-proxy.conf; }
    # Stream URLs: exactly /<section>/<user>/<password>/<file>, so the SPA's own /live page is untouched.
    location ~ "^/(live|movie|series)/[^/]+/[^/]+/[^/]+$" {
        rewrite ^/(.*)$ /api/v1/xtream/$1 break;
        proxy_pass http://neotv_api;
        include /etc/nginx/snippets/neotv-api-proxy.conf;
    }

    # nginx-rtmp callbacks are internal-only; never reachable from the internet.
    location /api/v1/live/ingest/ { return 404; }
    # Prometheus metrics: scrape from inside the network (token protected as well).
    location = /api/v1/kernel/metrics { allow 172.16.0.0/12; deny all; proxy_pass http://neotv_api; }

    # ── Protected HLS (API answers X-Accel-Redirect after verifying the grant) ──
    location /_protected_hls/ {
        internal;
        alias /var/lib/neotv/hls/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; video/iso.segment m4s; video/mp4 mp4; }
        add_header Cache-Control "no-store" always;
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    # nginx drops every inherited add_header once a location declares its own, so each location
    # that serves the app includes the shared set explicitly.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/neotv-security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/neotv-security-headers.conf;
        try_files $uri /index.html;
    }
}
