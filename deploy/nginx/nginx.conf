# NeoTV edge (nginx). TLS terminates in front of this (load balancer / certbot).
upstream neotv_api {
    server api:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# HSTS only when the TLS terminator in front says the request was HTTPS (an empty value = no header).
# No `preload`: joining the browsers' preload list is a separate, hard-to-undo operator decision.
map $http_x_forwarded_proto $neotv_hsts { https "max-age=31536000; includeSubDomains"; default ""; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 26m;          # playlist import (25 MB cap in the API)

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://neotv_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_buffering off;           # streamed proxy responses (HLS segments)
    }

    # nginx-rtmp callbacks are internal-only; never reachable from the internet.
    location /api/v1/live/ingest/ { return 404; }
    # Prometheus metrics: scrape from inside the network (token protected as well).
    location = /api/v1/kernel/metrics { allow 172.16.0.0/12; deny all; proxy_pass http://neotv_api; }

    # ── Protected HLS (API answers X-Accel-Redirect after verifying the grant) ──
    location /_protected_hls/ {
        internal;
        alias /var/lib/neotv/hls/;
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; video/iso.segment m4s; video/mp4 mp4; }
        add_header Cache-Control "no-store" always;
    }

    # ── SPA ────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    # nginx drops every inherited add_header once a location declares its own, so each location
    # that serves the app includes the shared set explicitly.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/neotv-security-headers.conf;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/neotv-security-headers.conf;
        try_files $uri /index.html;
    }
}
