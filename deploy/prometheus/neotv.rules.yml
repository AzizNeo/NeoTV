  - name: neotv-slo-burn
    rules:
      - alert: NeoTVAvailabilityBudgetBurnPage
        expr: neotv:sli_availability_errors:ratio_rate1h > 0.072 and neotv:sli_availability_errors:ratio_rate5m > 0.072
        for: 2m
        labels:
          severity: page
          slo: availability
        annotations:
          summary: "API requests answered without a server error (5xx): error budget burning 14.4x too fast"
          description: "Objective 99.5%. Bad-event ratio over 1h: {{ $value | humanizePercentage }} (alert at 7.20%)."
          runbook_url: docs/runbooks.md#slo-availability
      - alert: NeoTVAvailabilityBudgetBurnTicket
        expr: neotv:sli_availability_errors:ratio_rate6h > 0.03 and neotv:sli_availability_errors:ratio_rate30m > 0.03
        for: 15m
        labels:
          severity: ticket
          slo: availability
        annotations:
          summary: "API requests answered without a server error (5xx): error budget burning 6x too fast"
          description: "Objective 99.5%. Bad-event ratio over 6h: {{ $value | humanizePercentage }} (alert at 3.00%)."
