# RTMP ingest (tiangolo/nginx-rtmp). OBS → rtmp://<host>:1935/live/<ingest key>
#
# on_publish: the API verifies the key (HMAC hash lookup) and answers 302 with
# the channel's public playback id → nginx-rtmp *renames* the stream, so the
# secret key never appears in any URL a viewer can see. The transcoder worker
# then pulls rtmp://rtmp:1935/live/<playback id>.
worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        notify_method post;

        application live {
            live on;
            record off;
            allow publish all;
            allow play 172.16.0.0/12;   # only the internal transcoder may pull
            deny play all;
            on_publish      http://api:8000/api/v1/live/ingest/on-publish;
            on_publish_done http://api:8000/api/v1/live/ingest/on-done;
            drop_idle_publisher 15s;
        }
    }
}

http {
    server {
        listen 8080;
        location /stat { rtmp_stat all; allow 172.16.0.0/12; deny all; }
    }
}
